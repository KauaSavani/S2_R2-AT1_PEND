<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<title>Exibir Nome</title>

<style>

body{
    font-family: Arial, sans-serif;
    background-color: #f0f0f0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:white;
    padding:30px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input{
    padding:10px;
    margin-top:10px;
}

button{
    padding:10px 20px;
    margin-top:10px;
    background:#000000;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#0e82ff;
}

#mensagem{
    margin-top:15px;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h2>Digite seu nome</h2>

<input type="text" id="nome" placeholder="Seu nome">

<br><br>

<button id="botao">Mostrar mensagem</button>

<p id="mensagem"></p>

</div>

<script src="script.js"></script>

</body>
</html>
