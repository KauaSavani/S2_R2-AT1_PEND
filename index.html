<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<title>Alterar Texto</title>

<style>

body{
    font-family: Arial;
    background-color:#f0f0f0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:white;
    padding:30px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

button{
    padding:10px 20px;
    margin-top:15px;
    background-color:#28a745;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background-color:#218838;
}

</style>

</head>

<body>

<div class="container">

<h2>Alterar Texto com JavaScript</h2>

<p id="texto">
Clique no botão para mudar este texto.
</p>

<button id="botao">
Mudar Texto
</button>

</div>

<script src="script.js"></script>

</body>
</html>
