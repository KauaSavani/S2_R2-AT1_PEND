<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<title>Lista Dinâmica</title>

<style>

body{
    font-family: Arial, sans-serif;
    background-color:#f0f0f0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:white;
    padding:30px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input{
    padding:10px;
    margin-top:10px;
}

button{
    padding:10px 20px;
    margin-left:5px;
    background:black;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#0e82ff;
}

ul{
    margin-top:20px;
    text-align:left;
}

</style>

</head>

<body>

<div class="container">

<h2>Adicionar Item na Lista</h2>

<input type="text" id="item" placeholder="Digite um item">

<button id="botaoAdicionar">
Adicionar
</button>

<ul id="lista"></ul>

</div>

<script src="script.js"></script>

</body>
</html>
